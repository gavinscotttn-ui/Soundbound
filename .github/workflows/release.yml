name: Release

# Attaches the installers to a tagged release. Run by pushing a tag such as v1.0.0.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Android
            task: ":androidApp:assembleRelease"
            android: true
            path: androidApp/build/outputs/apk/release/*.apk
          - os: macos-latest
            label: macOS
            task: "-Psoundbound.withAndroid=false :desktopApp:packageDmg"
            android: false
            path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            label: Windows
            task: "-Psoundbound.withAndroid=false :desktopApp:packageMsi"
            android: false
            path: desktopApp/build/compose/binaries/main/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        if: matrix.android
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still includes the long-obsolete `tools` package,
          # which sdkmanager now refuses outright and which fails the whole step. Naming exactly
          # what the build needs avoids it.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew ${{ matrix.task }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach the files
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
