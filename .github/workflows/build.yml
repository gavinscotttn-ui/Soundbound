name: Build

# Builds every artefact on every push: the Android APK, the macOS .dmg and the Windows .msi.
# The unit tests run on their own job first, because they take seconds and the packaging jobs take
# minutes — there is no sense waiting for a .dmg to discover that the sentence segmenter is broken.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  test:
    name: Tests (:core and :pdfjvm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Temporarily off while the Android and Windows configuration failure is diagnosed:
          # both jobs restore a Gradle home saved by a failed run, and a stale cache is one of
          # the two explanations being ruled out here.
          cache-disabled: true

      # -Psoundbound.withUi=false keeps this job to the pure-Kotlin modules, which need no Android
      # SDK and no Google Maven. It is also the configuration the engine is developed against.
      - name: Run unit tests
        run: ./gradlew -Psoundbound.withUi=false -Psoundbound.withAndroid=false :core:test :pdfjvm:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/test
            pdfjvm/build/reports/tests/test
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still includes the long-obsolete `tools` package,
          # which sdkmanager now refuses outright and which fails the whole step. Naming exactly
          # what the build needs avoids it.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Temporarily off while the Android and Windows configuration failure is diagnosed:
          # both jobs restore a Gradle home saved by a failed run, and a stale cache is one of
          # the two explanations being ruled out here.
          cache-disabled: true

      - name: Build the debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      # Unsigned, because the signing key is not in the repository. Install the debug APK for
      # everyday use, or sign this one with your own key — see docs/building.md.
      - name: Build the release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soundbound-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: soundbound-release-apk-unsigned
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            format: dmg
            artifact: soundbound-macos-dmg
          - os: windows-latest
            label: Windows
            format: msi
            artifact: soundbound-windows-msi
          - os: ubuntu-latest
            label: Linux
            format: deb
            artifact: soundbound-linux-deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Temporarily off while the Android and Windows configuration failure is diagnosed:
          # both jobs restore a Gradle home saved by a failed run, and a stale cache is one of
          # the two explanations being ruled out here.
          cache-disabled: true

      # The desktop app needs no Android SDK. AGP itself is still resolved — :ui declares it so
      # that it can add an Android target — but withAndroid=false stops that target being added,
      # and with it the need for an installed SDK.
      - name: Package the desktop app
        run: ./gradlew -Psoundbound.withAndroid=false :desktopApp:packageDistributionForCurrentOS --stacktrace

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktopApp/build/compose/binaries/main/${{ matrix.format }}/*
          retention-days: 30
          if-no-files-found: error
