org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Flip these to false to build :core on a machine with no Android SDK / no access
# to Google's Maven repository.
soundbound.withUi=true
soundbound.withAndroid=true

# The Android Gradle Plugin's version. It lives here rather than in a plugins block so that
# settings.gradle.kts and :ui's buildscript can both read it without resolving AGP on builds
# that have asked for no Android target at all.
soundbound.agpVersion=8.11.1
