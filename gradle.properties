org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Flip these to false to build :core on a machine with no Android SDK / no access
# to Google's Maven repository.
soundbound.withUi=true
soundbound.withAndroid=true

# The Android Gradle Plugin's version. It lives here rather than in a plugins block so that
# settings.gradle.kts and :ui's buildscript can both read it without resolving AGP on builds
# that have asked for no Android target at all.
soundbound.agpVersion=9.1.0

# AGP 9 brings its own Kotlin support and a new DSL, and refuses to sit beside either the
# standalone Kotlin Android plugin or Kotlin Multiplatform's `com.android.library` usage. Its
# recommended replacement for :ui is the `com.android.kotlin.multiplatform.library` plugin,
# which is a different DSL again; these two properties are the bypass AGP itself offers, and
# they keep one Kotlin plugin in charge of every module. Worth revisiting once the multiplatform
# Android library plugin has settled.
android.builtInKotlin=false
android.newDsl=false
